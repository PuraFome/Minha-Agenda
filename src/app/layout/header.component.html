<header class="header">
  <a class="brand" routerLink="/" aria-label="Minha Agenda — página inicial">
    <span class="brand__mark" aria-hidden="true">MA</span>
    <span class="brand__name">Minha Agenda</span>
  </a>

  <nav class="nav" aria-label="Navegação principal">
    <a class="nav__link" routerLink="/" routerLinkActive="nav__link--active" [routerLinkActiveOptions]="{ exact: true }">Mural</a>
    <a class="nav__link" routerLink="/nova-missao" routerLinkActive="nav__link--active">Nova Missão</a>
    <a class="nav__link" routerLink="/perfil" routerLinkActive="nav__link--active">Perfil</a>
    </nav>

    @if (user(); as u) {
      <a
        class="avatar"
        routerLink="/perfil"
        [attr.aria-label]="'Perfil de ' + (u.name || u.email)"
      >
        @if (u.picture) {
          <img class="avatar__img" [src]="u.picture" [alt]="u.name || 'Foto do perfil'" />
        } @else {
          <span class="avatar__fallback">{{ userInitials() }}</span>
        }
      </a>
    } @else {
      <a class="nav__login" routerLink="/login">Entrar</a>
    }

    <button
      type="button"
      class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="themeLabel()"
    [attr.title]="themeLabel()"
  >
    <svg
      class="theme-toggle__icon"
      [class.theme-toggle__icon--hidden]="isDark()"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2" />
      <path d="M12 20v2" />
      <path d="m4.93 4.93 1.41 1.41" />
      <path d="m17.66 17.66 1.41 1.41" />
      <path d="M2 12h2" />
      <path d="M20 12h2" />
      <path d="m6.34 17.66-1.41 1.41" />
      <path d="m19.07 4.93-1.41 1.41" />
    </svg>
    <svg
      class="theme-toggle__icon"
      [class.theme-toggle__icon--hidden]="!isDark()"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>
</header>
